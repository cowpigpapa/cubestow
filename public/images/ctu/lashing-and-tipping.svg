<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" width="1672" height="941" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<defs>
  <marker id="a-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#d9482b"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1f8a5b"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1f6fd1"/></marker><marker id="a-strap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#e4572e"/></marker><marker id="a-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1d2a3a"/></marker>
</defs>
<rect width="1672" height="941" fill="#ffffff"/>
<rect x="30" y="30" width="520" height="880" fill="#fbfcfd" stroke="#c9d2dc" stroke-width="2" rx="16"/><text x="54" y="72" font-size="26" font-weight="800" fill="#1d2a3a" text-anchor="start">직접 래싱</text><line x1="70" y1="760" x2="510" y2="760" stroke="#2f5aa8" stroke-width="6"/><rect x="218" y="592" width="144" height="168" fill="#d9a066" stroke="#a8743a" stroke-width="3" rx="0"/><line x1="218" y1="592" x2="362" y2="760" stroke="#a8743a" stroke-width="2"/><line x1="362" y1="592" x2="218" y2="760" stroke="#a8743a" stroke-width="2"/><line x1="218" y1="622" x2="79.99999999999997" y2="760" stroke="#e4572e" stroke-width="8"/><circle cx="79.99999999999997" cy="760" r="9" fill="#1d2a3a"/><path d="M 149.99999999999997 760 A 70 70 0 0 0 129.4974746830583 710.5025253169417" fill="none" stroke="#1d2a3a" stroke-width="2.5"/><text x="157.99999999999997" y="742" font-size="26" font-weight="700" fill="#1d2a3a" text-anchor="start">α</text><text x="70" y="120" font-size="20" font-weight="500" fill="#1d2a3a" text-anchor="start">화물의 고정점과 바닥 고정점을</text><text x="70" y="148" font-size="20" font-weight="500" fill="#1d2a3a" text-anchor="start">바로 잇습니다. 힘을 CTU 구조로</text><text x="70" y="176" font-size="20" font-weight="500" fill="#1d2a3a" text-anchor="start">직접 넘기며, 능력은 MSL에 비례.</text><text x="70" y="230" font-size="22" font-weight="800" fill="#e4572e" text-anchor="start">미끄럼 방지 각도 α = 30°~60°</text><text x="70" y="262" font-size="20" font-weight="600" fill="#5f6b78" text-anchor="start">사전장력은 MSL의 50% 이하</text><text x="70" y="290" font-size="20" font-weight="600" fill="#5f6b78" text-anchor="start">가장 약한 요소만큼만 믿습니다</text><text x="70" y="820" font-size="18" font-weight="500" fill="#5f6b78" text-anchor="start">그림의 α = 45° (§4.3.2)</text><rect x="576" y="30" width="520" height="880" fill="#fbfcfd" stroke="#c9d2dc" stroke-width="2" rx="16"/><text x="600" y="72" font-size="26" font-weight="800" fill="#1d2a3a" text-anchor="start">톱오버(타이다운) 래싱</text><line x1="616" y1="760" x2="1056" y2="760" stroke="#2f5aa8" stroke-width="6"/><rect x="764" y="592" width="144" height="168" fill="#d9a066" stroke="#a8743a" stroke-width="3" rx="0"/><line x1="764" y1="592" x2="908" y2="760" stroke="#a8743a" stroke-width="2"/><line x1="908" y1="592" x2="764" y2="760" stroke="#a8743a" stroke-width="2"/><polyline points="674,760 764,592 908,592 998,760" fill="none" stroke="#e4572e" stroke-width="8" stroke-linejoin="round"/><circle cx="674" cy="760" r="9" fill="#1d2a3a"/><circle cx="998" cy="760" r="9" fill="#1d2a3a"/><line x1="836" y1="502" x2="836" y2="578" stroke="#1f6fd1" stroke-width="6" marker-end="url(#a-blue)"/><text x="852" y="540" font-size="20" font-weight="700" fill="#1f6fd1" text-anchor="start">FV ≈ 1.8 × 사전장력</text><text x="616" y="120" font-size="20" font-weight="500" fill="#1d2a3a" text-anchor="start">화물 위로 넘겨 양쪽 바닥에 겁니다.</text><text x="616" y="148" font-size="20" font-weight="500" fill="#1d2a3a" text-anchor="start">사전장력이 화물을 바닥에 눌러</text><text x="616" y="176" font-size="20" font-weight="500" fill="#1d2a3a" text-anchor="start">마찰을 키웁니다(마찰 고정).</text><text x="616" y="230" font-size="22" font-weight="800" fill="#e4572e" text-anchor="start">추가 고정력 Fsec = FV · μ</text><text x="616" y="262" font-size="18" font-weight="600" fill="#5f6b78" text-anchor="start">예) STF 4kN → FV 7.2kN, μ 0.3 → 약 2.2kN</text><text x="616" y="290" font-size="18" font-weight="600" fill="#5f6b78" text-anchor="start">무거운 화물은 톱오버만으로 막기 어렵습니다</text><text x="616" y="820" font-size="18" font-weight="500" fill="#5f6b78" text-anchor="start">수직 래싱 기준 (§4.2.7)</text><rect x="1122" y="30" width="520" height="880" fill="#fbfcfd" stroke="#c9d2dc" stroke-width="2" rx="16"/><text x="1146" y="72" font-size="26" font-weight="800" fill="#1d2a3a" text-anchor="start">전도(넘어짐) 조건</text><line x1="1162" y1="760" x2="1602" y2="760" stroke="#2f5aa8" stroke-width="6"/><rect x="1334" y="532" width="96" height="228" fill="#d9a066" stroke="#a8743a" stroke-width="3" rx="0"/><line x1="1334" y1="532" x2="1430" y2="760" stroke="#a8743a" stroke-width="2"/><line x1="1430" y1="532" x2="1334" y2="760" stroke="#a8743a" stroke-width="2"/><circle cx="1382" cy="646" r="12" fill="#fff" stroke="#1d2a3a" stroke-width="3"/><path d="M1382 634A12 12 0 0 1 1394 646L1382 646Z M1382 658A12 12 0 0 1 1370 646L1382 646Z" fill="#1d2a3a"/><circle cx="1430" cy="760" r="8" fill="#d9482b"/><text x="1444" y="790" font-size="18" font-weight="700" fill="#d9482b" text-anchor="start">전도축</text><line x1="1382" y1="646" x2="1382" y2="760" stroke="#1d2a3a" stroke-width="2" stroke-dasharray="6 5"/><line x1="1382" y1="744" x2="1430" y2="744" stroke="#1d2a3a" stroke-width="2"/><text x="1406" y="734" font-size="22" font-weight="800" fill="#1d2a3a" text-anchor="middle">b</text><text x="1366" y="703" font-size="22" font-weight="800" fill="#1d2a3a" text-anchor="end">d</text><line x1="1232" y1="646" x2="1362" y2="646" stroke="#d9482b" stroke-width="6" marker-end="url(#a-red)"/><text x="1232" y="632" font-size="20" font-weight="700" fill="#d9482b" text-anchor="start">c · m · g</text><line x1="1442" y1="576" x2="1442" y2="676" stroke="#1f6fd1" stroke-width="6" marker-end="url(#a-blue)"/><text x="1456" y="616" font-size="20" font-weight="700" fill="#1f6fd1" text-anchor="start">cz · m · g</text><text x="1162" y="120" font-size="20" font-weight="500" fill="#1d2a3a" text-anchor="start">아래 식이 참이면(같아도) 고정이 필요합니다.</text><text x="1162" y="170" font-size="30" font-weight="800" fill="#e4572e" text-anchor="start">c · d ≥ cz · b</text><text x="1162" y="210" font-size="19" font-weight="600" fill="#5f6b78" text-anchor="start">무게중심이 가운데면 높이/폭 ≥ cz/c</text><text x="1162" y="246" font-size="19" font-weight="700" fill="#1d2a3a" text-anchor="start">도로 앞 1.25 · 도로 좌우 2.0</text><text x="1162" y="274" font-size="19" font-weight="700" fill="#1d2a3a" text-anchor="start">해상 C 좌우 1.25 · 해상 C 앞뒤 0.5</text><text x="1162" y="820" font-size="18" font-weight="500" fill="#5f6b78" text-anchor="start">그림: 폭 0.8m × 높이 1.9m 화물 (§4.3.1)</text>
</svg>
