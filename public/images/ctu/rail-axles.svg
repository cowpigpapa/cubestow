<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" width="1672" height="941" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<defs>
  <marker id="a-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#d9482b"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1f8a5b"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1f6fd1"/></marker><marker id="a-strap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#e4572e"/></marker><marker id="a-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1d2a3a"/></marker>
</defs>
<rect width="1672" height="941" fill="#ffffff"/>
<text x="197" y="70" font-size="28" font-weight="800" fill="#1d2a3a" text-anchor="start">IM6 원문 예: 2축 컨테이너 화차, 화물 29.2t</text><text x="197" y="108" font-size="19" font-weight="500" fill="#5f6b78" text-anchor="start">화물 무게중심이 바닥 끝에서 6.7m(중심 6.39m보다 0.31m 뒤)에 오면 두 축의 질량이 달라집니다.</text><rect x="197" y="180" width="1278" height="150" fill="#eef3fb" stroke="#2f5aa8" stroke-width="5" rx="0"/><rect x="187" y="330" width="1298" height="24" fill="#1d2a3a"/><circle cx="452.6" cy="385" r="34" fill="#fff" stroke="#1d2a3a" stroke-width="8"/><circle cx="452.6" cy="385" r="6" fill="#1d2a3a"/><circle cx="1219.4" cy="385" r="34" fill="#fff" stroke="#1d2a3a" stroke-width="8"/><circle cx="1219.4" cy="385" r="6" fill="#1d2a3a"/><line x1="157" y1="420" x2="1515" y2="420" stroke="#5f6b78" stroke-width="4"/><line x1="836" y1="140" x2="836" y2="330" stroke="#1d2a3a" stroke-width="2" stroke-dasharray="8 6"/><text x="826" y="130" font-size="18" font-weight="700" fill="#1d2a3a" text-anchor="end">중심 6.39m</text><line x1="867" y1="140" x2="867" y2="330" stroke="#d9482b" stroke-width="4"/><text x="877" y="130" font-size="18" font-weight="800" fill="#d9482b" text-anchor="start">화물 무게중심 6.7m</text><line x1="867" y1="200" x2="867" y2="300" stroke="#d9482b" stroke-width="6" marker-end="url(#a-red)"/><line x1="197" y1="740" x2="1475" y2="740" stroke="#1d2a3a" stroke-width="2"/><line x1="197" y1="560" x2="1475" y2="560" stroke="#d9482b" stroke-width="3" stroke-dasharray="10 8"/><text x="836" y="550" font-size="18" font-weight="700" fill="#d9482b" text-anchor="middle">선로 등급 C 축질량 한도 20t</text><rect x="392.6" y="569.9" width="120" height="170.1" fill="#1f8a5b" rx="6"/><text x="452.6" y="557.9" font-size="24" font-weight="800" fill="#1f8a5b" text-anchor="middle">18.9t</text><rect x="1159.4" y="550.1" width="120" height="189.9" fill="#d9482b" rx="6"/><text x="1219.4" y="538.1" font-size="24" font-weight="800" fill="#d9482b" text-anchor="middle">21.1t</text><text x="452.6" y="774" font-size="18" font-weight="700" fill="#1d2a3a" text-anchor="middle">1번 축</text><text x="1219.4" y="774" font-size="18" font-weight="700" fill="#1d2a3a" text-anchor="middle">2번 축</text><text x="197" y="830" font-size="19" font-weight="600" fill="#1d2a3a" text-anchor="start">무게중심이 조금만 치우쳐도 한 축이 한도를 넘습니다. 가장 무거운 화물은 화차 정중앙에 무게중심이 와야 실을 수 있습니다(IM6 §2.2.4).</text><text x="197" y="866" font-size="17" font-weight="500" fill="#5f6b78" text-anchor="start">축 위치는 개략이고, 축질량은 원문 예의 값입니다(화차 자중 포함). 실제 화차·샤시 제원으로 다시 확인합니다.</text>
</svg>
