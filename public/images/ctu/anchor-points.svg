<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" width="1672" height="941" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<defs>
  <marker id="a-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#d9482b"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1f8a5b"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1f6fd1"/></marker><marker id="a-strap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#e4572e"/></marker><marker id="a-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1d2a3a"/></marker>
</defs>
<rect width="1672" height="941" fill="#ffffff"/>
<rect x="30" y="30" width="620" height="880" fill="#fbfcfd" stroke="#c9d2dc" stroke-width="2" rx="16"/><text x="54" y="72" font-size="26" font-weight="800" fill="#1d2a3a" text-anchor="start">고정점 위치 (문쪽에서 본 단면, 실제 비율)</text><rect x="150" y="200" width="352.5" height="358.5" fill="#eef3fb" stroke="#2f5aa8" stroke-width="6" rx="0"/><circle cx="168" cy="542.5" r="13" fill="#fff" stroke="#1f8a5b" stroke-width="6"/><circle cx="484.5" cy="542.5" r="13" fill="#fff" stroke="#1f8a5b" stroke-width="6"/><circle cx="168" cy="222" r="13" fill="#fff" stroke="#c98a00" stroke-width="6"/><circle cx="484.5" cy="222" r="13" fill="#fff" stroke="#c98a00" stroke-width="6"/><text x="326.25" y="176" font-size="19" font-weight="700" fill="#c98a00" text-anchor="middle">위쪽 래싱 고리(상부 측면 레일)</text><text x="326.25" y="598.5" font-size="19" font-weight="700" fill="#1f8a5b" text-anchor="middle">바닥 고정점(하부 측면 레일)</text><text x="150" y="668.5" font-size="22" font-weight="800" fill="#1f8a5b" text-anchor="start">바닥 고정점</text><text x="320" y="668.5" font-size="22" font-weight="700" fill="#1d2a3a" text-anchor="start">최소 1,000daN (약 1t)</text><text x="150" y="708.5" font-size="22" font-weight="800" fill="#c98a00" text-anchor="start">위쪽 고리</text><text x="320" y="708.5" font-size="22" font-weight="700" fill="#1d2a3a" text-anchor="start">최소 500daN (약 0.5t)</text><text x="150" y="758.5" font-size="18" font-weight="500" fill="#5f6b78" text-anchor="start">ISO 1496-1 최소값입니다. 각인·제조사 자료로</text><text x="150" y="784.5" font-size="18" font-weight="500" fill="#5f6b78" text-anchor="start">확인하지 않았다면 이 값만 믿습니다.</text><rect x="676" y="30" width="966" height="880" fill="#fbfcfd" stroke="#c9d2dc" stroke-width="2" rx="16"/><text x="700" y="72" font-size="26" font-weight="800" fill="#1d2a3a" text-anchor="start">가장 약한 곳이 전체의 한계</text><text x="720" y="140" font-size="22" font-weight="800" fill="#1d2a3a" text-anchor="start">1. 래싱 2,000daN → 바닥 고정점 1,000daN</text><rect x="720" y="164" width="140" height="34" fill="#e8edf3" rx="4"/><text x="870" y="189" font-size="18" font-weight="600" fill="#5f6b78" text-anchor="start">벨트 2,000daN</text><rect x="720" y="210" width="70" height="34" fill="#1f8a5b" rx="4"/><text x="800" y="235" font-size="19" font-weight="800" fill="#1f8a5b" text-anchor="start">실제로 믿는 힘 1,000daN</text><text x="720" y="280" font-size="19" font-weight="600" fill="#5f6b78" text-anchor="start">벨트 능력의 절반</text><text x="720" y="380" font-size="22" font-weight="800" fill="#1d2a3a" text-anchor="start">2. 래싱 2,000daN → 위쪽 고리 500daN</text><rect x="720" y="404" width="140" height="34" fill="#e8edf3" rx="4"/><text x="870" y="429" font-size="18" font-weight="600" fill="#5f6b78" text-anchor="start">벨트 2,000daN</text><rect x="720" y="450" width="35" height="34" fill="#c98a00" rx="4"/><text x="765" y="475" font-size="19" font-weight="800" fill="#c98a00" text-anchor="start">실제로 믿는 힘 500daN</text><text x="720" y="520" font-size="19" font-weight="600" fill="#5f6b78" text-anchor="start">벨트 능력의 4분의 1</text><text x="720" y="620" font-size="22" font-weight="800" fill="#1d2a3a" text-anchor="start">3. 래싱 4,000daN × 2줄 → 위쪽 고리 500daN × 2</text><rect x="720" y="644" width="560" height="34" fill="#e8edf3" rx="4"/><text x="1290" y="669" font-size="18" font-weight="600" fill="#5f6b78" text-anchor="start">벨트 8,000daN</text><rect x="720" y="690" width="70" height="34" fill="#c98a00" rx="4"/><text x="800" y="715" font-size="19" font-weight="800" fill="#c98a00" text-anchor="start">실제로 믿는 힘 1,000daN</text><text x="720" y="760" font-size="19" font-weight="600" fill="#5f6b78" text-anchor="start">"8,000daN 고정"이 아님</text><text x="720" y="860" font-size="17" font-weight="500" fill="#5f6b78" text-anchor="start">한 고정점에 하프루프 양 끝을 걸면 그 고정점은 래싱 MSL의 1.4배 이상이어야 합니다(IM5 §5.3).</text>
</svg>
