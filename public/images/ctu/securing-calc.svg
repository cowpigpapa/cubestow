<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" width="1672" height="941" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<defs>
  <marker id="a-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#d9482b"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1f8a5b"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1f6fd1"/></marker><marker id="a-strap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#e4572e"/></marker><marker id="a-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1d2a3a"/></marker>
</defs>
<rect width="1672" height="941" fill="#ffffff"/>
<rect x="30" y="30" width="790" height="880" fill="#fbfcfd" stroke="#c9d2dc" stroke-width="2" rx="16"/><text x="54" y="72" font-size="26" font-weight="800" fill="#1d2a3a" text-anchor="start">가로 각재(문 앞 울타리)의 저항력</text><rect x="98" y="190" width="22" height="164.00000000000003" fill="#2f5aa8"/><rect x="648" y="190" width="22" height="164.00000000000003" fill="#2f5aa8"/><rect x="120" y="200" width="528" height="24" fill="#e2b77b" stroke="#a8743a" stroke-width="2" rx="0"/><rect x="120" y="224" width="528" height="24" fill="#e2b77b" stroke="#a8743a" stroke-width="2" rx="0"/><rect x="120" y="248" width="528" height="24" fill="#e2b77b" stroke="#a8743a" stroke-width="2" rx="0"/><rect x="120" y="272" width="528" height="24" fill="#e2b77b" stroke="#a8743a" stroke-width="2" rx="0"/><rect x="120" y="296" width="528" height="24" fill="#e2b77b" stroke="#a8743a" stroke-width="2" rx="0"/><rect x="120" y="320" width="528" height="24" fill="#e2b77b" stroke="#a8743a" stroke-width="2" rx="0"/><line x1="120" y1="378" x2="648" y2="378" stroke="#1d2a3a" stroke-width="2" marker-start="url(#a-ink)" marker-end="url(#a-ink)"/><text x="384" y="410" font-size="20" font-weight="700" fill="#1d2a3a" text-anchor="middle">자유 길이 L = 2.2m</text><text x="688" y="220" font-size="18" font-weight="700" fill="#1d2a3a" text-anchor="start">h = 10cm</text><text x="688" y="246" font-size="16" font-weight="600" fill="#5f6b78" text-anchor="start">(두께 w = 5cm)</text><text x="88" y="280" font-size="16" font-weight="600" fill="#5f6b78" text-anchor="end">기둥</text><text x="70" y="120" font-size="28" font-weight="800" fill="#e4572e" text-anchor="start">F = n · w² · h / (28 · L)  [kN]</text><text x="70" y="156" font-size="18" font-weight="600" fill="#5f6b78" text-anchor="start">n 각재 수, w 두께·h 높이 [cm], L 자유 길이 [m]</text><text x="70" y="620" font-size="22" font-weight="700" fill="#1d2a3a" text-anchor="start">원문 예: 5×10cm 각재 6개</text><text x="70" y="656" font-size="24" font-weight="800" fill="#1f8a5b" text-anchor="start">F = 6 × 5² × 10 / (28 × 2.2) ≈ 24kN</text><text x="70" y="700" font-size="18" font-weight="600" fill="#5f6b78" text-anchor="start">두께 w가 제곱으로 들어가므로 두꺼운 각재가 훨씬 강합니다.</text><text x="70" y="728" font-size="18" font-weight="600" fill="#5f6b78" text-anchor="start">못 박은 블로킹은 못 1개당 1~4kN으로 작은 힘에만 씁니다.</text><rect x="846" y="30" width="796" height="880" fill="#fbfcfd" stroke="#c9d2dc" stroke-width="2" rx="16"/><text x="870" y="72" font-size="26" font-weight="800" fill="#1d2a3a" text-anchor="start">더니지 백(에어백) 계산</text><rect x="900" y="210" width="192" height="288" fill="#d9a066" stroke="#a8743a" stroke-width="3" rx="0"/><line x1="900" y1="210" x2="1092" y2="498" stroke="#a8743a" stroke-width="2"/><line x1="1092" y1="210" x2="900" y2="498" stroke="#a8743a" stroke-width="2"/><rect x="1143.2" y="210" width="192" height="288" fill="#d9a066" stroke="#a8743a" stroke-width="3" rx="0"/><line x1="1143.2" y1="210" x2="1335.2" y2="498" stroke="#a8743a" stroke-width="2"/><line x1="1335.2" y1="210" x2="1143.2" y2="498" stroke="#a8743a" stroke-width="2"/><rect x="1094" y="220" width="47.2" height="268" rx="23.6" fill="#efe2c4" stroke="#b59a5b" stroke-width="3"/><line x1="1090" y1="534" x2="1145.2" y2="534" stroke="#1d2a3a" stroke-width="2" marker-end="url(#a-ink)" marker-start="url(#a-ink)"/><text x="1117.6" y="568" font-size="18" font-weight="700" fill="#1d2a3a" text-anchor="middle">틈 d = 200mm</text><text x="1365.2" y="240" font-size="17" font-weight="600" fill="#5f6b78" text-anchor="start">위에서 본 모습</text><text x="886" y="120" font-size="26" font-weight="800" fill="#e4572e" text-anchor="start">F_DB ≥ F_CARGO 이어야 합니다</text><text x="886" y="156" font-size="18" font-weight="600" fill="#5f6b78" text-anchor="start">백 1200×1800mm, 파열 0.5bar, 일회용(SF 0.75)</text><text x="886" y="640" font-size="19" font-weight="700" fill="#1d2a3a" text-anchor="start">화물이 미는 힘 F_CARGO = 10 × 9.81 × (0.8 − 0.3 × 0.75) ≈ 56kN</text><text x="886" y="676" font-size="19" font-weight="700" fill="#1d2a3a" text-anchor="start">접촉 면적 A = (1.2 − π·0.2/2)(1.8 − π·0.2/2) ≈ 1.32m²</text><text x="886" y="712" font-size="19" font-weight="700" fill="#1d2a3a" text-anchor="start">백 허용 힘 F_DB = A × 10 × 9.81 × 0.5 × 0.75 ≈ 48kN</text><text x="886" y="760" font-size="24" font-weight="800" fill="#d9482b" text-anchor="start">48 &lt; 56kN → 이 백으로는 모자랍니다</text><text x="886" y="800" font-size="17" font-weight="500" fill="#5f6b78" text-anchor="start">도로 종방향 0.8g, 백 뒤 화물 10t, μ 0.3의 가정값입니다(부록 4 §4).</text>
</svg>
